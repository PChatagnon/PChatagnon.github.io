<footer class="footer">
  {% for item in site.data.settings.social %}
      <a href="{{ item.link }}" class="menu-link" target="_blank">
        {% if item.image %}
          <img src="{{ item.image }}" alt="Social Icon" class="social-icon">
        {% else %}
          <i class="fa fa-{{ item.icon }}" aria-hidden="true"></i>
        {% endif %}
      </a>
      {% endfor %}
  <div class="footer-description"><a href="{{ site.github.url }}/">{{ site.description }} of {{ site.author }}</a></div>
</footer>
